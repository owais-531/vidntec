# Local development database only. Production uses Railway Postgres.
#   docker compose up -d db      # start
#   docker compose down          # stop (keeps data)
#   docker compose down -v       # stop + wipe data

services:
  db:
    image: postgres:16-alpine
    container_name: vidntec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidntec
      POSTGRES_PASSWORD: vidntec
      POSTGRES_DB: vidntec
    ports:
      - '5432:5432'
    volumes:
      - vidntec-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vidntec -d vidntec']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vidntec-db-data:
